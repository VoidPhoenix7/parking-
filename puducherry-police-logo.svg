<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="100%" height="100%">
  <defs>
    <!-- Rich Golden Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="50%" stop-color="#F5B300"/>
      <stop offset="100%" stop-color="#C68A00"/>
    </linearGradient>
    <!-- Deep Maroon/Ruby Gradient for Police Shield -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9E1B1B"/>
      <stop offset="60%" stop-color="#7B1113"/>
      <stop offset="100%" stop-color="#550B0C"/>
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Top Crown / Ashoka Pedestal Crest (Lion Capital crest top) -->
  <g id="crown-crest" transform="translate(0, 0)">
    <!-- Central decorative turret/crest -->
    <path d="M52 14 L60 6 L68 14 L64 20 L56 20 Z" fill="url(#goldGrad)" stroke="#B37400" stroke-width="0.8"/>
    <!-- Left turret -->
    <path d="M42 16 L48 11 L52 17 L46 21 Z" fill="url(#goldGrad)" stroke="#B37400" stroke-width="0.8"/>
    <!-- Right turret -->
    <path d="M78 16 L72 11 L68 17 L74 21 Z" fill="url(#goldGrad)" stroke="#B37400" stroke-width="0.8"/>
    <!-- Crest Base Band -->
    <rect x="40" y="20" width="40" height="4" rx="1.5" fill="url(#goldGrad)" stroke="#B37400" stroke-width="0.6"/>
    <!-- Pearl dots on band -->
    <circle cx="46" cy="22" r="1" fill="#FFFFFF"/>
    <circle cx="53" cy="22" r="1" fill="#FFFFFF"/>
    <circle cx="60" cy="22" r="1" fill="#FFFFFF"/>
    <circle cx="67" cy="22" r="1" fill="#FFFFFF"/>
    <circle cx="74" cy="22" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Main Traditional Police Shield -->
  <!-- Outer Gold Rim -->
  <path d="M60 22 C82 22 98 25 102 32 C104 56 102 92 60 134 C18 92 16 56 18 32 C22 25 38 22 60 22 Z"
        fill="url(#goldGrad)" filter="url(#shieldShadow)" stroke="#B37400" stroke-width="1"/>

  <!-- Inner Maroon / Crimson Shield Body -->
  <path d="M60 26 C80 26 94 29 97 35 C99 56 97 88 60 128 C23 88 21 56 23 35 C26 29 40 26 60 26 Z"
        fill="url(#crimsonGrad)"/>

  <!-- Inner Gold Inset Filigree Border -->
  <path d="M60 30 C77 30 89 33 92 38 C94 57 92 84 60 122 C28 84 26 57 28 38 C31 33 43 30 60 30 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.85"/>

  <!-- Golden Laurel Wreath / Ears of Corn (Police Honor Emblem) -->
  <g id="laurel-wreath" stroke="url(#goldGrad)" fill="url(#goldGrad)">
    <!-- Left Branch Leaves -->
    <path d="M37 54 C33 50 31 43 36 41 C39 44 38 50 37 54 Z"/>
    <path d="M34 66 C29 63 28 56 33 53 C36 56 36 62 34 66 Z"/>
    <path d="M34 78 C29 76 27 69 32 66 C35 69 36 74 34 78 Z"/>
    <path d="M36 90 C32 89 29 82 34 78 C37 81 38 86 36 90 Z"/>
    <path d="M42 101 C38 101 34 95 38 90 C42 93 43 97 42 101 Z"/>
    <path d="M50 110 C46 111 41 106 44 101 C48 103 50 107 50 110 Z"/>

    <!-- Right Branch Leaves -->
    <path d="M83 54 C87 50 89 43 84 41 C81 44 82 50 83 54 Z"/>
    <path d="M86 66 C91 63 92 56 87 53 C84 56 84 62 86 66 Z"/>
    <path d="M86 78 C91 76 93 69 88 66 C85 69 84 74 86 78 Z"/>
    <path d="M84 90 C88 89 91 82 86 78 C83 81 82 86 84 90 Z"/>
    <path d="M78 101 C82 101 86 95 82 90 C78 93 77 97 78 101 Z"/>
    <path d="M70 110 C74 111 79 106 76 101 C72 103 70 107 70 110 Z"/>

    <!-- Wreath Tie at bottom -->
    <path d="M57 114 L60 111 L63 114 L60 117 Z" fill="#FFE885"/>
  </g>

  <!-- Central Circular Medal / Insignia -->
  <circle cx="60" cy="72" r="22" fill="#5F0B0D" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <circle cx="60" cy="72" r="19.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2.5, 1.5"/>

  <!-- "PP" Monogram (Puducherry Police) -->
  <!-- Left P -->
  <g fill="url(#goldGrad)" stroke="#B37400" stroke-width="0.4">
    <path d="M49 61 H58 C62 61 64 63.5 64 67 C64 70.5 62 73 58 73 H52.5 V83 H49 V61 Z M52.5 64 V70 H57 C59.2 70 60.5 69 60.5 67 C60.5 65 59.2 64 57 64 H52.5 Z"/>
    <!-- Right P slightly offset / interlaced style for official monogram -->
    <path d="M62 61 H71 C75 61 77 63.5 77 67 C77 70.5 75 73 71 73 H65.5 V83 H62 V61 Z M65.5 64 V70 H70 C72.2 70 73.5 69 73.5 67 C73.5 65 72.2 64 70 64 H65.5 Z"/>
  </g>

  <!-- Stars of Rank / Honor above & below monogram -->
  <!-- Top Star -->
  <polygon points="60,40 61.5,43.5 65,44 62.5,46.5 63,50 60,48 57,50 57.5,46.5 55,44 58.5,43.5" fill="url(#goldGrad)"/>
  
  <!-- Subtle Bottom Star -->
  <polygon points="60,95 61.2,97.8 64,98.2 62,100.2 62.4,103 60,101.4 57.6,103 58,100.2 56,98.2 58.8,97.8" fill="url(#goldGrad)"/>

  <!-- Top "PUDUCHERRY POLICE" Arched Text -->
  <path id="archTextPath" d="M 32 37 Q 60 29 88 37" fill="none"/>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="5.2" font-weight="800" fill="#FFE885" letter-spacing="1">
    <textPath href="#archTextPath" startOffset="50%" text-anchor="middle">
      PUDUCHERRY POLICE
    </textPath>
  </text>

  <!-- Bottom Banner Ribbon for Motto -->
  <g id="bottom-ribbon" transform="translate(0, 116)">
    <!-- Ribbon Tail Left -->
    <path d="M26 8 L18 12 L22 3 L32 2 L29 10 Z" fill="#9E1B1B" stroke="#B37400" stroke-width="0.6"/>
    <!-- Ribbon Tail Right -->
    <path d="M94 8 L102 12 L98 3 L88 2 L91 10 Z" fill="#9E1B1B" stroke="#B37400" stroke-width="0.6"/>
    <!-- Main Center Ribbon -->
    <path d="M28 3 Q 60 -1 92 3 L90 12 Q 60 7 30 12 Z" fill="url(#goldGrad)" stroke="#B37400" stroke-width="0.8" filter="url(#shieldShadow)"/>
    <text x="60" y="8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="4.8" font-weight="800" fill="#4A0002" text-anchor="middle" letter-spacing="0.8">
      TRAFFIC POLICE
    </text>
  </g>
</svg>
