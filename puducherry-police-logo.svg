<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Rich Golden Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#F5B300"/>
      <stop offset="80%" stop-color="#C68A00"/>
      <stop offset="100%" stop-color="#8F5E00"/>
    </linearGradient>
    <!-- Deep Maroon/Ruby Gradient for Police Shield -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9E1B1B"/>
      <stop offset="55%" stop-color="#7B1113"/>
      <stop offset="100%" stop-color="#4E0809"/>
    </linearGradient>
    <filter id="shieldShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Top Crown / Ashoka Pedestal Crest (Lion Capital crest top) -->
  <g id="crown-crest" transform="translate(20, 4)">
    <!-- Central decorative turret/crest -->
    <path d="M52 14 L60 5 L68 14 L64 20 L56 20 Z" fill="url(#goldGrad)" stroke="#8F5E00" stroke-width="0.8"/>
    <!-- Left turret -->
    <path d="M41 16 L48 10 L52 17 L46 21 Z" fill="url(#goldGrad)" stroke="#8F5E00" stroke-width="0.8"/>
    <!-- Right turret -->
    <path d="M79 16 L72 10 L68 17 L74 21 Z" fill="url(#goldGrad)" stroke="#8F5E00" stroke-width="0.8"/>
    <!-- Crest Base Band -->
    <rect x="38" y="20" width="44" height="4.5" rx="2" fill="url(#goldGrad)" stroke="#8F5E00" stroke-width="0.6"/>
    <!-- Pearl dots on band -->
    <circle cx="44" cy="22.2" r="1.1" fill="#FFFFFF"/>
    <circle cx="52" cy="22.2" r="1.1" fill="#FFFFFF"/>
    <circle cx="60" cy="22.2" r="1.1" fill="#FFFFFF"/>
    <circle cx="68" cy="22.2" r="1.1" fill="#FFFFFF"/>
    <circle cx="76" cy="22.2" r="1.1" fill="#FFFFFF"/>
  </g>

  <!-- Main Traditional Police Shield (Centered at X=80) -->
  <!-- Outer Gold Rim -->
  <path d="M80 26 C106 26 124 30 129 38 C131 66 128 105 80 148 C32 105 29 66 31 38 C36 30 54 26 80 26 Z"
        fill="url(#goldGrad)" filter="url(#shieldShadow)" stroke="#8F5E00" stroke-width="1.2"/>

  <!-- Inner Maroon / Crimson Shield Body -->
  <path d="M80 30 C104 30 120 34 124 41 C126 66 123 100 80 142 C37 100 34 66 36 41 C40 34 56 30 80 30 Z"
        fill="url(#crimsonGrad)"/>

  <!-- Inner Gold Inset Filigree Border -->
  <path d="M80 34 C100 34 114 38 118 44 C120 66 117 96 80 136 C43 96 40 66 42 44 C46 38 60 34 80 34 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.9"/>

  <!-- Top "PUDUCHERRY POLICE" Text -->
  <path id="archTextPath" d="M 46 54 Q 80 43 114 54" fill="none"/>
  <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif" 
        font-size="6.2" font-weight="900" fill="#FFF2A3" letter-spacing="1.2">
    <textPath href="#archTextPath" startOffset="50%" text-anchor="middle">
      PUDUCHERRY POLICE
    </textPath>
  </text>

  <!-- Golden Laurel Wreath / Ears of Corn (Police Honor Emblem) -->
  <g id="laurel-wreath" stroke="url(#goldGrad)" fill="url(#goldGrad)">
    <!-- Left Branch Leaves -->
    <path d="M54 66 C49 61 47 54 53 52 C57 55 55 62 54 66 Z"/>
    <path d="M51 79 C45 76 44 68 50 65 C54 68 53 75 51 79 Z"/>
    <path d="M51 92 C45 89 43 81 49 78 C53 82 53 88 51 92 Z"/>
    <path d="M53 105 C48 103 46 95 51 91 C55 95 56 100 53 105 Z"/>
    <path d="M60 117 C55 116 52 109 57 104 C61 108 61 113 60 117 Z"/>
    <path d="M69 126 C64 126 60 120 64 115 C68 118 70 122 69 126 Z"/>

    <!-- Right Branch Leaves -->
    <path d="M106 66 C111 61 113 54 107 52 C103 55 105 62 106 66 Z"/>
    <path d="M109 79 C115 76 116 68 110 65 C106 68 107 75 109 79 Z"/>
    <path d="M109 92 C115 89 117 81 111 78 C107 82 107 88 109 92 Z"/>
    <path d="M107 105 C112 103 114 95 109 91 C105 95 104 100 107 105 Z"/>
    <path d="M100 117 C105 116 108 109 103 104 C99 108 99 113 100 117 Z"/>
    <path d="M91 126 C96 126 100 120 96 115 C92 118 90 122 91 126 Z"/>

    <!-- Wreath Tie at bottom -->
    <path d="M76 129 L80 125 L84 129 L80 133 Z" fill="#FFF2A3"/>
  </g>

  <!-- Central Circular Medal / Insignia -->
  <circle cx="80" cy="88" r="23" fill="#5F0B0D" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="80" cy="88" r="20.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3, 1.8"/>

  <!-- "PP" Official Interlocking Monogram (Puducherry Police) -->
  <g fill="url(#goldGrad)" stroke="#8F5E00" stroke-width="0.4">
    <!-- Left P -->
    <path d="M68 76 H78 C82.5 76 85 78.8 85 82.5 C85 86.2 82.5 89 78 89 H72 V100 H68 V76 Z M72 79.5 V85.5 H77 C79.5 85.5 81 84.4 81 82.5 C81 80.6 79.5 79.5 77 79.5 H72 Z"/>
    <!-- Right P (Slightly shifted) -->
    <path d="M82 76 H92 C96.5 76 99 78.8 99 82.5 C99 86.2 96.5 89 92 89 H86 V100 H82 V76 Z M86 79.5 V85.5 H91 C93.5 85.5 95 84.4 95 82.5 C95 80.6 93.5 79.5 91 79.5 H86 Z"/>
  </g>

  <!-- Star of Honor in Central Medal -->
  <polygon points="80,64 81.5,67.8 85.5,68.2 82.5,71 83.3,75 80,73 76.7,75 77.5,71 74.5,68.2 78.5,67.8" fill="url(#goldGrad)"/>

  <!-- Bottom Banner Ribbon for Motto -->
  <g id="bottom-ribbon" transform="translate(0, 131)">
    <!-- Ribbon Tail Left -->
    <path d="M42 9 L33 13 L37 3 L49 2 L45 11 Z" fill="#9E1B1B" stroke="#8F5E00" stroke-width="0.7"/>
    <!-- Ribbon Tail Right -->
    <path d="M118 9 L127 13 L123 3 L111 2 L115 11 Z" fill="#9E1B1B" stroke="#8F5E00" stroke-width="0.7"/>
    <!-- Main Center Ribbon -->
    <path d="M44 3 Q 80 -2 116 3 L114 13 Q 80 8 46 13 Z" fill="url(#goldGrad)" stroke="#8F5E00" stroke-width="0.9" filter="url(#shieldShadow)"/>
    <text x="80" y="8.8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Arial, sans-serif" 
          font-size="5.5" font-weight="900" fill="#4A0002" text-anchor="middle" letter-spacing="1">
      TRAFFIC POLICE
    </text>
  </g>
</svg>
